<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a101d">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Basket Stats</title>
<style>
:root{--bg:#0b1220;--panel:#111a2e;--panel2:#18243f;--line:#27365a;--tx:#e8eefc;--mut:#8ea0c4;--acc:#f59e0b;--ok:#16a34a;--ko:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;user-select:none;-webkit-user-select:none}
button:active{filter:brightness(1.35)}
button:disabled{opacity:.35}
input,select,textarea{font:inherit;color:var(--tx);background:#0b1426;border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
textarea{min-height:230px;font-family:ui-monospace,Consolas,monospace}
label{display:block;color:var(--mut);font-size:14px;margin:8px 0 4px}
[hidden]{display:none!important}
nav{display:flex;position:sticky;top:0;z-index:5;background:#0a101d;border-bottom:1px solid var(--line)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:14px 4px;font-weight:600;color:var(--mut)}
nav button.on{color:var(--acc);box-shadow:inset 0 -3px var(--acc)}
main{padding:10px;max-width:1300px;margin:0 auto}
h3{margin:4px 0 8px}
.mut{color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.row>*{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
/* scoreboard */
.sb{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:10px}
.sbt{text-align:center;min-width:0}
.tn{font-weight:700;color:var(--mut);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc{font-size:clamp(44px,9vw,84px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.sbm{text-align:center}
.per{color:var(--acc);font-weight:700}
.clk{font-size:clamp(34px,6vw,56px);font-weight:800;font-variant-numeric:tabular-nums;cursor:pointer;padding:0 8px;line-height:1.1}
.sbb{display:flex;gap:8px;justify-content:center;margin-top:4px}
button.go{background:var(--ok);border-color:var(--ok);font-weight:700}
button.stop{background:var(--ko);border-color:var(--ko);font-weight:700}
/* board */
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pad{grid-column:1/-1;order:3;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px}
@media(min-width:900px){.board{grid-template-columns:1fr 340px 1fr}.pad{grid-column:auto;order:0}}
.col{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:8px}
.ch{display:flex;justify-content:space-between;align-items:center;font-weight:700;padding:2px 4px;gap:6px}
.ch span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tf{font-size:13px;color:var(--mut);white-space:nowrap}
.tf.bonus{color:#ff6b6b;font-weight:700}
.pc{display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;text-align:left;gap:0 8px;min-height:64px;align-items:center}
.pc .n{grid-row:1/3;font-size:26px;font-weight:800;text-align:center;color:var(--acc)}
.pc .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .ps{font-size:12px;color:var(--mut)}
.pc.sel{outline:3px solid var(--acc);background:#2a2f45}
.pc.warn{border-color:#f59e0b}
.pc.out{border-color:var(--ko);background:#3a1620}
.who{text-align:center;font-weight:700;padding:6px 4px 10px;min-height:36px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 button{min-height:58px;font-weight:700;padding:6px}
.grid3 .ok{background:#12391f;border-color:var(--ok)}
.grid3 .ko{background:#431616;border-color:#7f1d1d}
.grid3 .ut{background:#16253f}
/* tables */
.tw{overflow-x:auto;margin-bottom:6px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15px}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:13px}
th:nth-child(2),td:nth-child(2){text-align:left}
tr.tot td{font-weight:800;border-top:2px solid var(--line)}
.pct{color:var(--mut);margin:4px 2px 14px;font-size:14px}
.h2{display:flex;justify-content:space-between;align-items:baseline;margin:14px 2px 6px;font-weight:800;font-size:18px}
/* court */
.court{width:100%;max-width:560px;display:block;margin:8px auto;border-radius:8px;touch-action:manipulation}
/* log */
.lg{padding:8px 4px;border-bottom:1px solid var(--line)}
.lg b{color:var(--acc);font-variant-numeric:tabular-nums;margin-right:6px}
/* modal / toast */
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
#modal.on{display:flex}
#modal .m{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;max-width:780px;width:100%;max-height:92vh;overflow:auto}
.bench{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.bench button{min-height:56px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#000d;border:1px solid var(--line);padding:10px 16px;border-radius:999px;z-index:30;display:none}
.chk{display:flex;align-items:center;gap:8px;color:var(--tx);margin:0}
.chk input{width:auto}
.hi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.hi .b{display:flex;gap:6px}
summary{cursor:pointer;padding:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1}
.grid2 button{min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px}
.grid2 .ok{background:#12391f;border-color:var(--ok)}
.grid2 .ko{background:#431616;border-color:#7f1d1d}
.grid3m{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3m .sm{min-height:48px;font-size:20px;font-weight:800}
.ob{font-size:34px;font-weight:800;line-height:1}
.os{font-size:12px;color:var(--mut)}
table.o th:nth-child(2),table.o td:nth-child(2){text-align:right}
.chip{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:-2px;border:2px solid #94a3b8}
.chip.jw{background:#f8fafc}
.chip.jb{background:#2563eb;border-color:#60a5fa}
.col.jw{border-top:4px solid #f8fafc}
.col.jb{border-top:4px solid #3b82f6}
.gname{text-align:center;color:var(--acc);font-weight:700;margin:0 0 6px}
.cbtn{min-height:52px;font-weight:700}
.cbtn.on{outline:3px solid var(--acc);background:#2a2f45}
.xtra{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:2px}
.xtra button{padding:8px 4px;font-size:13px;min-height:52px;line-height:1.2}
.xtra b{display:block;font-size:17px}
.xtra .xto{background:#16253f;border-color:#2f4b7c}
.xtra .over{background:#431616;border-color:var(--ko)}
.endrow{margin-top:14px}
.endbtn{flex:0 0 auto;max-width:260px;margin:0 auto;background:#3a1620;border-color:#7f1d1d;font-weight:700}
.stepgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
.stp{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.stp .sl{font-size:13px;color:var(--mut);text-align:center;margin-bottom:4px}
.stp .sr{display:flex;align-items:center;gap:6px}
.stp .sr button{flex:0 0 52px;min-height:50px;font-size:26px;font-weight:800;padding:0;line-height:1}
.stp .sr .sp{background:#12391f;border-color:var(--ok)}
.stp .sr .sm{background:#431616;border-color:#7f1d1d}
.stp .sv{flex:1;text-align:center;font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.pchips{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-bottom:4px}
.pchip{padding:6px 12px;border-radius:999px;font-weight:700;font-size:14px;color:var(--mut)}
.pchip.on{color:var(--acc);border-color:var(--acc);background:#2a2f45}
.bn{display:flex;flex-wrap:wrap;gap:6px}
.bn .fh{flex:1 0 100%;margin:4px 0 0}
.bc{padding:6px 10px;font-size:14px;min-height:40px}
.bc.sel{outline:3px solid var(--acc)}
.endcard{border-color:var(--acc)}
.fh{color:var(--mut);font-size:13px;margin:10px 0 4px}
.fgrp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fgrp button{min-height:54px;font-weight:800;font-size:18px}
.cv{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.cv .chk{gap:10px}
.cv .chk input{width:24px;height:24px}
</style>
</head>
<body>
<nav>
  <button data-a="view" data-v="game">Partita</button>
  <button data-a="view" data-v="subs">Cambi</button>
  <button data-a="view" data-v="box">Box score</button>
  <button data-a="view" data-v="shots">Tiri</button>
  <button data-a="view" data-v="log">Cronaca</button>
  <button data-a="view" data-v="menu">Menu</button>
</nav>
<main>
  <section id="v-game"></section>
  <section id="v-subs" hidden></section>
  <section id="v-box" hidden></section>
  <section id="v-shots" hidden></section>
  <section id="v-log" hidden></section>
  <section id="v-menu" hidden></section>
</main>
<div id="modal"><div class="m" id="modal-c"></div></div>
<div id="toast"></div>

<script src="firebase-config.js"></script>
<script src="vendor/firebase-app-compat.js"></script>
<script src="vendor/firebase-auth-compat.js"></script>
<script src="vendor/firebase-firestore-compat.js"></script>
<script>
'use strict';
/* ---------- utilità ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => { s = Math.max(0, Math.ceil(s)); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); };
const fmtMin = s => { s = Math.round(s); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
const pct = (m,a) => a ? Math.round(m/a*100) + '%' : '–';
const periodName = (q,nq) => q <= nq ? 'Q' + q : 'OT' + (q - nq);
const loadJSON = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } };
const saveJSON = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };

const KEY = 'bbstats_current', HKEY = 'bbstats_history', TKEY = 'bbstats_teams', LKEY = 'bbstats_askloc';
const RKEY = 'bbstats_roster', CKEY = 'bbstats_conv';

/* ---------- la mia squadra (anagrafica) e convocati ---------- */
const getRoster = () => loadJSON(RKEY) || {name: 'La mia squadra', players: []};
const getConv = () => { const c = loadJSON(CKEY) || {}; return {sel: c.sel || [], starters: c.starters || [], side: c.side || 0, color: c.color === 'blue' ? 'blue' : 'white'}; };
function saveRoster(r) { r.updatedAt = Date.now(); saveJSON(RKEY, r); scheduleSync(); }
const byNum = (a, b) => {
  const x = a.num === '' ? 1e9 : +a.num, y = b.num === '' ? 1e9 : +b.num;
  return x - y || a.name.localeCompare(b.name);
};
function addMyPlayer() {
  const n = $('#rp-n').value.trim(), m = $('#rp-m').value.trim();
  if (!n && !m) { toast('Inserisci numero e cognome'); return; }
  const r = getRoster();
  r.players.push({id: 'p' + Date.now(), num: n, name: m || 'Giocatore ' + n});
  r.players.sort(byNum); saveRoster(r); menuOpen.roster = true; render();
  setTimeout(() => { const f = $('#rp-n'); if (f) f.focus(); }, 0);
}
function editMyPlayer(id) {
  const r = getRoster(), p = r.players.find(x => x.id === id); if (!p) return;
  const v = prompt('Numero e cognome (es. 7 Rossi)', (p.num !== '' ? p.num + ' ' : '') + p.name); if (v === null) return;
  const m = v.trim().match(/^(\d{1,3})\s*[-.:)]?\s*(.*)$/);
  if (m) { p.num = m[1]; p.name = m[2] || 'Giocatore ' + m[1]; } else if (v.trim()) { p.num = ''; p.name = v.trim(); } else return;
  r.players.sort(byNum); saveRoster(r); menuOpen.roster = true; render();
}
function delMyPlayer(id) {
  const r = getRoster(), p = r.players.find(x => x.id === id); if (!p) return;
  if (!confirm('Eliminare ' + label(p) + ' dalla squadra?')) return;
  r.players = r.players.filter(x => x.id !== id); saveRoster(r);
  const c = getConv(); c.sel = c.sel.filter(x => x !== id); c.starters = c.starters.filter(x => x !== id); saveJSON(CKEY, c);
  menuOpen.roster = true; render();
}
function updateConvUI(c) {
  const el = $('#cvcount'); if (el) el.textContent = c.sel.length + '/12';
}
function convChange(inp) {
  const c = getConv(), id = inp.dataset.id;
  if (inp.checked) {
    if (c.sel.length >= 12) { inp.checked = false; toast('Massimo 12 convocati'); return; }
    c.sel.push(id);
  } else { c.sel = c.sel.filter(x => x !== id); c.starters = c.starters.filter(x => x !== id); }
  saveJSON(CKEY, c); updateConvUI(c);
}

const STAT0 = () => ({sec:0,pts:0,fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0,oreb:0,dreb:0,ast:0,stl:0,blk:0,to:0,pf:0,pm:0});

/* ---------- stato dell'applicazione ---------- */
let S = loadJSON(KEY);          // partita corrente
if (S) S.running = false;
let sel = null;                  // {t,pid}
let view = 'game';
let undoStack = [];
let pending = null;
let askLoc = localStorage.getItem(LKEY) !== '0';
let shotFilter = {t:'all', pid:'all'};
let menuOpen = {};
let gdraft = '';                 // nome partita digitato nel form (non perso se il Menu si ridisegna)               // riquadri del Menu aperti/chiusi dall'utente
document.addEventListener('toggle', e => {
  const k = e.target && e.target.dataset && e.target.dataset.k;
  if (k) menuOpen[k] = e.target.open;
}, true);
let lastTs = null, lastSave = 0, lastBoxRender = 0;
let subQ = null, subForm = null, endBanner = null, lineupCtx = null;

function save() { if (S) { recompute(S); saveJSON(KEY, S); } lastSave = performance.now(); }

/* ---------- periodi, quintetti e cambi (timeline) ---------- */
const periodLen = (g, q) => q <= g.nq ? g.qlen : 300;
const myTeam = g => { const i = g.teams.findIndex(T => !T.isOpp); return i < 0 ? 0 : i; };
const bySubTime = (a, b) => b.c - a.c || a.seq - b.seq;
function lineupAt(g, q, t, c) {
  const L = ((g.starts && g.starts[q] && g.starts[q][t]) || []).slice();
  (g.subs || []).filter(s => s.t === t && s.q === q && s.c >= c).sort(bySubTime).forEach(s => {
    const i = L.indexOf(s.out); if (i >= 0) L[i] = s.in;
  });
  return L;
}
function validateSubs(g, q, t) {
  const L = ((g.starts && g.starts[q] && g.starts[q][t]) || []).slice();
  const nm = id => { const p = findPlayer(g, id); return p ? label(p) : '?'; };
  const subs = (g.subs || []).filter(s => s.t === t && s.q === q).sort(bySubTime);
  for (const s of subs) {
    const i = L.indexOf(s.out);
    if (i < 0) return nm(s.out) + ' non è in campo a ' + fmt(s.c) + '.';
    if (L.includes(s.in)) return nm(s.in) + ' è già in campo a ' + fmt(s.c) + '.';
    L[i] = s.in;
  }
  return null;
}
function syncOnCourt(g) {
  let changed = false;
  g.teams.forEach((T, t) => {
    if (T.isOpp) return;
    const L = lineupAt(g, g.quarter, t, g.clock);
    if (JSON.stringify(L) !== JSON.stringify(T.onCourt)) { T.onCourt = L; changed = true; }
  });
  return changed;
}
/* minuti giocati, plus/minus e falli di squadra si ricavano dalla timeline: starts + subs + pts */
function recompute(g) {
  if (!g || !g.starts) return;
  g.clocks = g.clocks || {}; g.clocks[g.quarter] = g.clock;
  const sec = {}, pm = {};
  g.teams.forEach(T => T.players.forEach(p => { sec[p.id] = 0; pm[p.id] = 0; }));
  const maxq = g.maxq || g.quarter;
  g.teams.forEach((T, t) => {
    if (T.isOpp) return;
    for (let q = 1; q <= maxq; q++) {
      if (!g.starts[q]) continue;
      const end = q === g.quarter ? g.clock : (g.clocks[q] != null ? g.clocks[q] : 0);
      const L = (g.starts[q][t] || []).slice();
      let cur = periodLen(g, q);
      (g.subs || []).filter(s => s.t === t && s.q === q && s.c >= end).sort(bySubTime).forEach(s => {
        const cc = Math.min(cur, s.c);
        L.forEach(id => { if (id in sec) sec[id] += cur - cc; });
        const i = L.indexOf(s.out); if (i >= 0) L[i] = s.in;
        cur = cc;
      });
      L.forEach(id => { if (id in sec) sec[id] += Math.max(0, cur - end); });
    }
  });
  (g.pts || []).forEach(e => g.teams.forEach((T, t) => {
    if (T.isOpp) return;
    lineupAt(g, e.q, t, e.c).forEach(id => { if (id in pm) pm[id] += (e.t === t ? e.n : -e.n); });
  }));
  Object.keys(g.stats).forEach(id => { if (id in sec) { g.stats[id].sec = sec[id]; g.stats[id].pm = pm[id]; } });
  if (g.fouls) {
    g.tf = [0, 0];
    g.fouls.forEach(x => { if (x.q !== g.quarter) return; const F = FOULS[x.type]; if (F ? F.tm : x.type !== 'T') g.tf[x.t]++; });
  }
  syncOnCourt(g);
}
function migrate(g) {
  if (!g || g.starts) return;
  const q = g.quarter || 1;
  g.maxq = q; g.clocks = {}; g.clocks[q] = g.clock; g.subs = []; g.pts = []; g.seq = 0;
  g.starts = {}; g.starts[q] = g.teams.map(T => T.isOpp ? [] : (T.onCourt || []).slice());
}


/* ---------- account e sincronizzazione (Firebase, facoltativa) ---------- */
const DKEY = 'bbstats_deleted', UKEY = 'bbstats_cloud_uid', SKEY = 'bbstats_lastsync';
const cloud = {state: 'off', user: null, auth: null, db: null, status: '', syncing: false, again: false, error: ''};
let accDraft = '', syncTimer = null;
const cfgOK = () => { const c = window.FIREBASE_CONFIG; return !!(c && c.apiKey && c.projectId && !/^INCOLLA/i.test(c.apiKey) && !/^INCOLLA/i.test(c.projectId)); };
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms || 20000))]);
const lastSync = () => { const t = +localStorage.getItem(SKEY); return t ? new Date(t).toLocaleString('it-IT') : null; };
function setStatus(msg) {
  if (msg !== undefined) cloud.status = msg;
  const el = $('#syncst');
  if (el) el.textContent = cloud.status || (lastSync() ? 'Ultima sincronizzazione: ' + lastSync() : 'Non ancora sincronizzato');
}
const AUTHERR = {
  'auth/invalid-email': 'Email non valida.', 'auth/user-not-found': 'Account non trovato.', 'auth/wrong-password': 'Password errata.',
  'auth/invalid-credential': 'Email o password errate.', 'auth/email-already-in-use': 'Esiste già un account con questa email.',
  'auth/weak-password': 'Password troppo corta (minimo 6 caratteri).', 'auth/network-request-failed': 'Nessuna connessione a internet.',
  'auth/too-many-requests': 'Troppi tentativi: riprova tra qualche minuto.', 'auth/missing-password': 'Inserisci la password.',
  'auth/unauthorized-domain': 'Dominio non autorizzato: aggiungilo in Firebase → Authentication → Impostazioni.'
};
function cloudInit() {
  if (!window.firebase) { cloud.state = 'nosdk'; return; }
  if (!cfgOK()) { cloud.state = 'noconfig'; return; }
  try {
    firebase.initializeApp(window.FIREBASE_CONFIG);
    cloud.auth = firebase.auth(); cloud.db = firebase.firestore();
    try { cloud.db.settings({ignoreUndefinedProperties: true, merge: true}); } catch (e) {}
    cloud.state = 'ready';
    cloud.auth.onAuthStateChanged(u => {
      cloud.user = u || null; cloud.status = '';
      if (u) syncNow();
      if (view === 'menu') render();
    });
  } catch (e) { cloud.state = 'error'; cloud.error = e.message || String(e); }
}
function scheduleSync() {
  if (!cloud.user) return;
  clearTimeout(syncTimer); syncTimer = setTimeout(() => syncNow(), 1500);
}
async function accAuth(mode) {

    setStatus('');

  }

  if (view === 'menu' && !(ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName))) render();
}
/* squadra e partite archiviate: vince la versione più recente (updatedAt); la partita in corso non si sincronizza */
async function syncData(uid) {
  const base = cloud.db.collection('users').doc(uid), rRef = base.collection('meta').doc('roster'), gRef = base.collection('games');
  const [rd, gs] = await withTimeout(Promise.all([rRef.get(), gRef.get()]), 20000);
  const jobs = [];
  /* ---- squadra ---- */
  const remote = rd.exists ? rd.data() : null, local = getRoster();
  const lt = local.updatedAt || 0, rt = remote ? (remote.updatedAt || 0) : 0;
  const pushRoster = () => { const t = lt || Date.now(); if (!lt) { local.updatedAt = t; saveJSON(RKEY, local); }
    jobs.push(() => rRef.set({name: local.name || '', players: local.players || [], updatedAt: t})); };
  if (remote && rt > lt) {
    if (local.players.length && lt === 0 && !confirm('Sul cloud c\'è già una squadra ("' + (remote.name || '') + '", ' + (remote.players || []).length + ' giocatori). Usarla al posto di quella di questo dispositivo?')) {
      local.updatedAt = Date.now(); saveJSON(RKEY, local); jobs.push(() => rRef.set({name: local.name || '', players: local.players, updatedAt: local.updatedAt}));
    } else {
      const players = (remote.players || []).map(x => ({id: x.id, num: String(x.num ?? ''), name: String(x.name || '')}));
      saveJSON(RKEY, {name: remote.name || 'La mia squadra', players, updatedAt: rt});
      const c = getConv(), ids = players.map(x => x.id); c.sel = c.sel.filter(id => ids.includes(id)); c.starters = c.starters.filter(id => ids.includes(id)); saveJSON(CKEY, c);
    }
  } else if ((local.players.length || lt > 0) && (!remote || lt > rt)) pushRoster();
  /* ---- partite archiviate ---- */
  const remoteG = {}; gs.forEach(d => { remoteG[d.id] = d.data(); });
  const tomb = loadJSON(DKEY) || {};
  const upd = g => g.updatedAt || Date.parse(g.endedAt || g.date) || 0;
  const byId = {}; (loadJSON(HKEY) || []).forEach(g => { byId[String(g.id)] = g; });
  Object.keys(tomb).forEach(id => { delete byId[id]; });
  Object.keys(remoteG).forEach(id => {
    const r = remoteG[id], t = r.updatedAt || 0, l = byId[id];
    if (S && String(S.id) === id) return;                         // partita ripresa: resta locale
    if (tomb[id] && tomb[id] >= t) return;                         // cancellata qui: da propagare
    if (r.deleted) { if (l && t >= upd(l)) delete byId[id]; return; }
    if (!l || t > upd(l)) { try { const g = JSON.parse(r.data); g.updatedAt = t; byId[id] = g; delete tomb[id]; } catch (e) {} }
  });
  Object.keys(byId).forEach(id => {
    const g = byId[id], t = upd(g), r = remoteG[id];
    if (!g.updatedAt) g.updatedAt = t;
    if (!r || t > (r.updatedAt || 0)) jobs.push(() => gRef.doc(id).set({data: JSON.stringify(g), updatedAt: t, name: g.name || ''}));
  });
  const pushedTomb = [];
  Object.keys(tomb).forEach(id => {
    const r = remoteG[id];
    if (!r || (!r.deleted && (r.updatedAt || 0) <= tomb[id])) jobs.push(() => gRef.doc(id).set({deleted: true, updatedAt: tomb[id]}));
    pushedTomb.push(id);
  });
  saveJSON(HKEY, Object.keys(byId).map(id => byId[id]).sort((a, b) => upd(b) - upd(a)).slice(0, 40));
  if (jobs.length) await withTimeout(Promise.all(jobs.map(f => f())), 30000);
  if (pushedTomb.length) { const t2 = loadJSON(DKEY) || {}; pushedTomb.forEach(id => { delete t2[id]; }); saveJSON(DKEY, t2); }
}

/* ---------- creazione partita ---------- */
function parseRoster(text, ti) {
  const out = [];
  String(text).split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach((line, i) => {
    const m = line.match(/^(\d{1,3})\s*[-.:)]?\s*(.*)$/);
    out.push({id: ti + '-' + i, num: m ? m[1] : '', name: m ? (m[2] || 'Giocatore ' + m[1]) : line});
  });
  return out;
}
function newGame(cfg) {
  const teams = cfg.teams.map((t, ti) => {
    const players = t.players ? t.players.map((p, i) => ({id: ti + '-' + i, num: p.num, name: p.name})) : parseRoster(t.roster, ti);
    return {name: t.name || (ti ? 'Ospiti' : 'Casa'), players, isOpp: !!t.isOpp, onCourt: players.slice(0,5).map(p => p.id)};
  });
  const stats = {};
  teams.forEach(t => t.players.forEach(p => stats[p.id] = STAT0()));
  return {id: Date.now(), date: new Date().toISOString(), name: cfg.name || '', colors: cfg.colors || null, teams, stats, shots: [], to: [[], []], oppStats: {m1:0,m2:0,m3:0,pf:0}, score: [0,0],
          quarter: 1, qlen: cfg.qlen * 60, nq: cfg.nq, clock: cfg.qlen * 60, running: false, tf: [0,0], log: [],
          starts: {1: teams.map(T => T.isOpp ? [] : T.players.slice(0, 5).map(p => p.id))}, subs: [], pts: [], clocks: {1: cfg.qlen * 60}, maxq: 1, seq: 0};
}

/* ---------- timeout, coach e panchina ---------- */
const halfOf = (g, q) => q > g.nq ? 'ot' + q : (q <= Math.ceil(g.nq / 2) ? 'h1' : 'h2');
const toAllow = (g, q) => q > g.nq ? 1 : (q <= Math.ceil(g.nq / 2) ? 2 : 3);
const toList = (g, t) => (g.to && g.to[t]) || [];
const toUsed = (g, t) => toList(g, t).filter(x => halfOf(g, x.q) === halfOf(g, g.quarter)).length;

  S.to = S.to || [[], []];

  S.to[t].push({q: S.quarter, c: S.clock});
  if (S.running) { S.running = false; wake(false); lastTs = null; }
  addLog(S.teams[t].name + ': Timeout (' + (used + 1) + '/' + allow + ')' + (used + 1 > allow ? ' – oltre il numero consentito' : ''));
  save(); render();
}

  const l = toList(g, t); if (!l.length) return '';
  const c = {}; l.forEach(x => { const h = halfOf(g, x.q); c[h] = (c[h] || 0) + 1; });

function exportTeam() {

  const data = {type: 'basketstats-team', version: 1, name: r.name, players: r.players.map(p => ({num: p.num, name: p.name}))};
  download((r.name || 'squadra').replace(/[^\w\-]+/g, '_') + '_squadra.json', JSON.stringify(data, null, 2), 'application/json');

function importTeam(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!d || d.type !== 'basketstats-team' || !Array.isArray(d.players)) throw 0;
      const stamp = Date.now();
      const players = d.players.filter(p => p && (p.num !== undefined || p.name)).map((p, i) =>
        ({id: 'p' + stamp + '_' + i, num: String(p.num ?? ''), name: String(p.name || ('Giocatore ' + p.num))}));
      if (!players.length) throw 0;
      const cur = getRoster();
      if (cur.players.length && !confirm('Sostituire la squadra attuale (' + cur.players.length + ' giocatori) con quella del file (' + players.length + ' giocatori)?')) return;
      players.sort(byNum);
      saveRoster({name: String(d.name || cur.name || 'La mia squadra'), players});
      const c = getConv(); c.sel = []; c.starters = []; saveJSON(CKEY, c);
      menuOpen.roster = true; render(); toast('Squadra importata: ' + players.length + ' giocatori');
    } catch (e) { toast('File squadra non valido'); }
  };
  rd.readAsText(file);
}
function stat(k) {
  if (!sel) { toast('Tocca prima un giocatore'); return; }
  if (k === 'pf') { openFoul(sel.t, sel.pid); return; }
  if (/^[mx][23]$/.test(k) && askLoc) { openShot(k); return; }
  apply(k, sel.t, sel.pid, null);
}
function statDec(k) {
  if (!sel) { toast('Tocca prima un giocatore'); return; }
  const st = S.stats[sel.pid];
  if (!st[k]) { toast('Già a zero'); return; }
  snap(); st[k]--;
  addLog(label(findPlayer(S, sel.pid)) + ' (' + S.teams[sel.t].name + '): Correzione −1 ' + NAMES[k].toLowerCase());
  save(); render();
}
function apply(k, t, pid, loc) {
  snap();
  const st = S.stats[pid], p = findPlayer(S, pid);
  if (k === 'm1' || k === 'x1') {
    st.fta++; if (k === 'm1') { st.ftm++; addPoints(t, pid, 1); }
  } else if (/^[mx][23]$/.test(k)) {
    const three = k[1] === '3', made = k[0] === 'm';
    st.fga++; if (three) st.tpa++;
    if (made) { st.fgm++; if (three) st.tpm++; addPoints(t, pid, three ? 3 : 2); }
    if (loc) S.shots.push({pid, t, x: Math.round(loc.x), y: Math.round(loc.y), made, three});
  } else {
    st[k]++; if (k === 'pf') S.tf[t]++;
  }
  const made = /^m/.test(k);
  addLog(label(p) + ' (' + S.teams[t].name + '): ' + NAMES[k] + (made ? '  [' + S.score[0] + '-' + S.score[1] + ']' : ''));
  save(); render();
}
function oppAction(t, k) {
  if (k === 'pf') { openFoul(t, null); return; }
  snap();
  const T = S.teams[t], o = S.oppStats;
  if (k[0] === 'd') {
    const n = +k[1];
    if (o['m' + n] < 1) { undoStack.pop(); toast('Nessun punto da togliere'); return; }
    o['m' + n]--; S.score[t] -= n;
    (S.pts = S.pts || []).push({t, n: -n, q: S.quarter, c: S.clock});

function undo() {

}

}

  const m = v.trim().match(/^(\d{1,2})(?::(\d{1,2}))?$/); if (!m) { toast('Formato non valido'); return; }

/* ---------- periodi: scelta, fine periodo, quintetto di inizio ---------- */
function goPeriod(q) {
  if (!S || q === S.quarter || q < 1 || q > S.maxq || !S.starts[q]) return;
  if (S.running) { S.running = false; wake(false); lastTs = null; }
  S.clocks[S.quarter] = S.clock;
  S.quarter = q; S.clock = S.clocks[q] != null ? S.clocks[q] : periodLen(S, q);
  undoStack = []; sel = null; endBanner = null; save(); render();
}
function periodEnded(silent) {
  S.running = false; wake(false); lastTs = null;
  S.clock = 0; S.clocks[S.quarter] = 0;
  addLog('Fine ' + periodName(S.quarter, S.nq));
  if (S.quarter === S.maxq) { endBanner = S.quarter; view = 'box'; }
  save(); if (!silent) beep(); render();
}
function endPeriod() {
  if (S.clock > 0 && !confirm('Il tempo non è finito (' + fmt(S.clock) + '). Chiudere comunque ' + periodName(S.quarter, S.nq) + '?')) return;
  periodEnded(true);
}
function startNextPeriod() {
  if (S.quarter < S.maxq) { goPeriod(S.quarter + 1); return; }
  if (S.quarter >= S.nq && S.score[0] !== S.score[1]) { toast('Partita finita: premi "Termina partita"'); return; }
  if (S.running) { S.running = false; wake(false); lastTs = null; }
  const t = myTeam(S), T = S.teams[t], q = S.maxq + 1;
  const pool = T.players.map(p => p.id), need = Math.min(5, pool.length);
  const prev = lineupAt(S, S.maxq, t, 0).filter(id => pool.includes(id));
  lineupCtx = {mode: 'next', q, t, pool, need, starters: need === pool.length ? pool.slice() : prev.slice(0, need)};
  if (need === pool.length) { lineupGo(); return; }
  openLineup();
}
function openLineup() {
  const x = lineupCtx, n = x.starters.length;
  openModal('<h3>Quintetto iniziale – ' + periodName(x.q, S.nq) + '</h3><div class="mut">Tocca i ' + x.need + ' giocatori che iniziano · <b>' + n + '/' + x.need + '</b></div><div class="bench">' +
    x.pool.map(id => '<button class="' + (x.starters.includes(id) ? 'go' : '') + '" data-a="lpick" data-id="' + id + '">' + esc(label(findPlayer(S, id))) + '</button>').join('') +
    '</div><div class="row"><button class="go" data-a="lgo"' + (n === x.need ? '' : ' disabled') + '>' + (x.mode === 'next' ? 'Avvia ' + periodName(x.q, S.nq) : 'Salva quintetto') + '</button><button data-a="closemodal">Annulla</button></div>');
}
function lineupPick(id) {
  const x = lineupCtx; if (!x) return;

  else if (x.starters.length >= x.need) { toast('Hai già scelto ' + x.need + ' giocatori: togline uno'); return; }
  else x.starters.push(id);
  openLineup();
}
function lineupGo() {
  const x = lineupCtx; if (!x || x.starters.length !== x.need) return;
  const mk = () => S.teams.map((T, i) => i === x.t ? x.starters.slice() : []);
  if (x.mode === 'edit') {
    const old = S.starts[x.q];
    S.starts[x.q] = mk();
    const err = validateSubs(S, x.q, x.t);
    if (err) { S.starts[x.q] = old; toast('Non posso: ' + err); return; }
    closeModal(); save(); render(); toast('Quintetto aggiornato'); return;
  }
  S.clocks[S.quarter] = S.clock;
  S.maxq = x.q; S.quarter = x.q; S.clock = S.clocks[x.q] = periodLen(S, x.q);
  S.starts[x.q] = mk();
  S.running = false; undoStack = []; sel = null; endBanner = null; view = 'game';
  addLog('Inizio ' + periodName(x.q, S.nq));

}

/* ---------- scheda Cambi (minuto di ingresso = tempo rimasto sul tabellone) ---------- */

function addSub() {

  snap();
  S.seq = (S.seq || 0) + 1;
  S.subs = S.subs || [];
  S.subs.push({t, q, c, out: f.out, in: f.inn, seq: S.seq});
  const err = validateSubs(S, q, t);

  addLog('Cambio ' + T.name + ': esce ' + label(findPlayer(S, f.out)) + ', entra ' + label(findPlayer(S, f.in || f.inn)) + ' (' + periodName(q, S.nq) + ' ' + fmt(c) + ')', q, c);
  subForm.out = null; subForm.inn = null;

let wl = null;

/* ---------- cronometro ---------- */
setInterval(() => {
  if (!S || !S.running) { lastTs = null; return; }
  const now = performance.now();
  if (lastTs == null) { lastTs = now; return; }
  const d = Math.min((now - lastTs) / 1000, S.clock); lastTs = now;
  S.clock -= d;
  if (S.clock <= 0.001) { periodEnded(false); return; }
  const c = $('#clock'); if (c) c.textContent = fmt(S.clock);
  if (syncOnCourt(S) && view === 'game') render();            // un cambio programmato è entrato in vigore
  if (view === 'box' && now - lastBoxRender > 1000) { lastBoxRender = now; renderBox(); }
  if (now - lastSave > 5000) save();
}, 200);

    '<div class="row">' + btn + '<button data-a="backgame">Torna alla partita</button></div></div>';
}
function boxHTML(g) {
  let h = parziali(g);
  g.teams.forEach((T, t) => {
    if (T.isOpp) { h += oppBox(g, T, t) + foulSum(g, t) + toSum(g, t); return; }
    const tot = STAT0();
    let rows = '';
    T.players.forEach(p => {
      const s = g.stats[p.id]; Object.keys(tot).forEach(k => tot[k] += s[k]);
      const on = T.onCourt.includes(p.id);
      rows += '<tr><td>' + esc(p.num) + '</td><td>' + esc(p.name) + (on && g === S ? ' •' : '') + '</td><td>' + fmtMin(s.sec) + '</td><td><b>' + s.pts + '</b></td><td>' + s.fgm + '/' + s.fga + '</td><td>' + s.tpm + '/' + s.tpa + '</td><td>' + s.ftm + '/' + s.fta + '</td><td>' + s.oreb + '</td><td>' + s.dreb + '</td><td>' + (s.oreb + s.dreb) + '</td><td>' + s.ast + '</td><td>' + s.stl + '</td><td>' + s.blk + '</td><td>' + s.to + '</td><td>' + s.pf + '</td><td>' + (s.pm > 0 ? '+' : '') + s.pm + '</td></tr>';
    });
    rows += '<tr class="tot"><td></td><td>Totale</td><td></td><td>' + tot.pts + '</td><td>' + tot.fgm + '/' + tot.fga + '</td><td>' + tot.tpm + '/' + tot.tpa + '</td><td>' + tot.ftm + '/' + tot.fta + '</td><td>' + tot.oreb + '</td><td>' + tot.dreb + '</td><td>' + (tot.oreb + tot.dreb) + '</td><td>' + tot.ast + '</td><td>' + tot.stl + '</td><td>' + tot.blk + '</td><td>' + tot.to + '</td><td>' + tot.pf + '</td><td></td></tr>';
    h += '<div class="h2"><span>' + esc(T.name) + '</span><span>' + g.score[t] + '</span></div><div class="tw"><table><thead><tr>' + COLS.map(c => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="pct">TC ' + pct(tot.fgm, tot.fga) + ' · 3P ' + pct(tot.tpm, tot.tpa) + ' · TL ' + pct(tot.ftm, tot.fta) + '</div>' + foulSum(g, t) + toSum(g, t);
  });
  return h;
}
function renderBox() {
  recompute(S);
  $('#v-box').innerHTML = bannerHTML() + boxHTML(S) +
    '<div class="row"><button data-a="csv">Esporta CSV (Excel)</button><button data-a="json">Esporta partita (JSON)</button></div>';
}
function renderShots() {
  const opts = (arr, cur) => arr.map(([v, t]) => '<option value="' + v + '"' + (String(cur) === String(v) ? ' selected' : '') + '>' + esc(t) + '</option>').join('');
  const teamOpts = [['all', 'Tutte']].concat(S.teams.map((T, i) => [i, T.name]).filter(([i]) => !S.teams[i].isOpp));
  let players = [['all', 'Tutti i giocatori']];
  S.teams.forEach((T, t) => { if (shotFilter.t === 'all' || +shotFilter.t === t) T.players.forEach(p => players.push([p.id, label(p) + (shotFilter.t === 'all' ? ' · ' + T.name : '')])); });
  const list = S.shots.filter(s => (shotFilter.t === 'all' || s.t === +shotFilter.t) && (shotFilter.pid === 'all' || s.pid === shotFilter.pid));
  const made = list.filter(s => s.made).length;
  $('#v-shots').innerHTML =
    '<div class="row"><select id="sf-t">' + opts(teamOpts, shotFilter.t) + '</select><select id="sf-p">' + opts(players, shotFilter.pid) + '</select></div>' +
    courtSVG(list.map(dot).join('')) +
    '<div class="pct" style="text-align:center">Tiri con posizione: ' + made + '/' + list.length + ' (' + pct(made, list.length) + ') · <span style="color:#22c55e">●</span> a segno · <span style="color:#ef4444">✕</span> sbagliato</div>';
}
function renderLog() {
  $('#v-log').innerHTML = S.log.length
    ? S.log.slice().reverse().map(l => '<div class="lg"><b>' + periodName(l.q, S.nq) + ' ' + fmt(l.c) + '</b>' + esc(l.msg) + '</div>').join('')
    : '<p class="mut">Nessun evento ancora.</p>';
}

  const saved0 = loadJSON(TKEY) || {}, def = defaultTeams();

  h += '<details class="card" data-k="roster"' + (roOpen ? ' open' : '') + '><summary><b>La mia squadra</b> <span class="mut">(' + R.players.length + ' giocatori)</span></summary>' +
    '<label>Nome squadra</label><input id="rname" value="' + esc(R.name) + '">' +
    '<div style="margin-top:10px">' + (R.players.length ? R.players.map(p => '<div class="hi"><div><b style="color:var(--acc)">' + esc(p.num) + '</b> ' + esc(p.name) + '</div><div class="b"><button data-a="editmy" data-id="' + p.id + '">Modifica</button><button data-a="delmy" data-id="' + p.id + '">✕</button></div></div>').join('') : '<span class="mut">Nessun giocatore salvato.</span>') + '</div>' +
    '<div class="row" style="margin-top:12px"><input id="rp-n" placeholder="N°" inputmode="numeric" style="max-width:90px;flex:0 0 90px"><input id="rp-m" placeholder="Cognome"><button data-a="addmy" style="flex:0 0 auto">+ Aggiungi</button></div>' +
    '<div class="row"><button data-a="expteam">Esporta squadra (file)</button></div><label>Importa squadra da file</label><input type="file" id="impteam" accept=".json,application/json"></details>';
  const mineHTML = R.players.length
    ? '<label>Convocati — <span id="cvcount"></span></label>' + R.players.map(p => '<div class="cv"><label class="chk"><input type="checkbox" data-cv="sel" data-id="' + p.id + '"' + (C.sel.includes(p.id) ? ' checked' : '') + '><b style="color:var(--acc);min-width:28px">' + esc(p.num) + '</b> ' + esc(p.name) + '</label></div>').join('')
    : '<p class="mut">Aggiungi prima i giocatori in "La mia squadra" qui sopra.</p>';
  h += '<details class="card" data-k="newgame"' + (ngOpen ? ' open' : '') + '><summary><b>Nuova partita</b></summary>' +
    '<label>Nome partita (facoltativo)</label><input id="gname" placeholder="es. Campionato – 5ª giornata" value="' + esc(gdraft) + '">' +
    '<label>Nome squadra avversaria</label><input id="tn-opp" value="' + esc(saved.opp.name) + '">' +
    '<label>La mia squadra gioca</label><select id="cside"><option value="0"' + (C.side === 0 ? ' selected' : '') + '>In casa</option><option value="1"' + (C.side === 1 ? ' selected' : '') + '>In trasferta</option></select>' +
    '<label>Colore della mia maglia</label><div class="row"><button class="cbtn' + (C.color === 'white' ? ' on' : '') + '" data-a="color" data-v="white"><i class="chip jw"></i>Bianca</button><button class="cbtn' + (C.color === 'blue' ? ' on' : '') + '" data-a="color" data-v="blue"><i class="chip jb"></i>Blu</button></div>' +
    '<div class="mut" style="font-size:14px">Gli avversari avranno la maglia ' + (C.color === 'white' ? 'blu' : 'bianca') + '.</div>' +
    mineHTML +
    '<div class="row"><div><label>Minuti per periodo</label><input id="qlen" type="number" min="1" max="20" value="' + saved.qlen + '"></div><div><label>Numero periodi</label><input id="nq" type="number" min="1" max="4" value="' + saved.nq + '"></div></div>' +
    '<p class="mut" style="font-size:14px">Il quintetto iniziale si sceglie dopo aver premuto "Inizia partita".</p>'+
    '<div class="row"><button class="go" data-a="newgame">Inizia partita' + (S ? ' (archivia la corrente)' : '') + '</button></div></details>';
  h += '<div class="card"><h3>Partite archiviate</h3>' + (hist.length ? hist.map(g =>
    '<div class="hi"><div>' + (g.name ? '<div style="font-weight:700;color:var(--acc)">' + esc(g.name) + '</div>' : '') + esc(g.teams[0].name) + ' <b>' + g.score[0] + '–' + g.score[1] + '</b> ' + esc(g.teams[1].name) + '<div class="mut" style="font-size:13px">' + new Date(g.date).toLocaleString('it-IT') + '</div></div><div class="b"><button data-a="hres" data-id="' + g.id + '">Riprendi</button><button data-a="hview" data-id="' + g.id + '">Vedi</button><button data-a="hcsv" data-id="' + g.id + '">CSV</button><button data-a="hdel" data-id="' + g.id + '">✕</button></div></div>').join('') : '<span class="mut">Nessuna.</span>') + '</div>';
  h += '<div class="card"><h3>Importa partita</h3><div class="mut" style="margin-bottom:8px">Per spostare una partita da un dispositivo all\'altro: esporta il JSON e importalo qui.</div><input type="file" id="imp" accept=".json,application/json"></div>';
  $('#v-menu').innerHTML = h;
  updateConvUI(C); setStatus();
}

/* ---------- archivio, export, import ---------- */
function archiveCurrent() {
  if (!S) return;
  const hist = loadJSON(HKEY) || [];
  S.running = false; recompute(S); S.updatedAt = Date.now(); hist.unshift(S); saveJSON(HKEY, hist.slice(0, 40)); scheduleSync();
}
let startCtx = null;
function startNewGame() {
  const r = getRoster(), c = getConv();
  if (!r.players.length) { toast('Aggiungi prima i giocatori alla tua squadra'); return; }
  const mine = r.players.filter(p => c.sel.includes(p.id));
  if (!mine.length) { toast('Seleziona i convocati'); return; }
  const qlen = Math.max(1, +$('#qlen').value || 10), nq = Math.min(4, Math.max(1, +$('#nq').value || 4));
  const oppName = $('#tn-opp').value.trim() || 'Avversari';
  saveJSON(TKEY, {opp: {name: oppName}, qlen, nq});
  startCtx = {
    mine, side: c.side, qlen, nq, color: c.color, gameName: $('#gname').value.trim(),
    myName: (r.name || '').trim() || 'La mia squadra',
    oppT: {name: oppName, players: [], isOpp: true},
    starters: c.starters.filter(id => mine.some(p => p.id === id)).slice(0, 5)
  };
  if (mine.length <= 5) { startCtx.starters = mine.map(p => p.id); launchGame(); return; }
  openStarters();
}
function openStarters() {
  const x = startCtx, n = x.starters.length;
  openModal('<h3>Quintetto iniziale</h3><div class="mut">Tocca i 5 giocatori che iniziano · <b>' + n + '/5</b></div><div class="bench">' +
    x.mine.map(p => '<button class="' + (x.starters.includes(p.id) ? 'go' : '') + '" data-a="stpick" data-id="' + p.id + '">' + esc(label(p)) + '</button>').join('') +
    '</div><div class="row"><button class="go" data-a="stgo"' + (n === 5 ? '' : ' disabled') + '>Avvia partita</button><button data-a="closemodal">Annulla</button></div>');
}
function pickStarter(id) {
  const x = startCtx; if (!x) return;
  if (x.starters.includes(id)) x.starters = x.starters.filter(i => i !== id);
  else if (x.starters.length >= 5) { toast('Hai già scelto 5 giocatori: togline uno'); return; }
  else x.starters.push(id);
  openStarters();
}
function launchGame() {
  const x = startCtx; if (!x) return;
  if (S && !confirm('La partita corrente verrà archiviata. Continuare?')) return;
  const c = getConv(); c.starters = x.starters.slice(); saveJSON(CKEY, c);   // ricordo il quintetto per la prossima volta
  const first = x.mine.filter(p => x.starters.includes(p.id)), rest = x.mine.filter(p => !x.starters.includes(p.id));
  const myT = {name: x.myName, players: [...first, ...rest]};
  const cfg = {teams: x.side === 0 ? [myT, x.oppT] : [x.oppT, myT], qlen: x.qlen, nq: x.nq, name: x.gameName,
    colors: x.side === 0 ? [x.color, x.color === 'white' ? 'blue' : 'white'] : [x.color === 'white' ? 'blue' : 'white', x.color]};
  closeModal(); startCtx = null; gdraft = ''; archiveCurrent();
  S = newGame(cfg); sel = null; undoStack = []; shotFilter = {t:'all', pid:'all'}; view = 'game';
  addLog('Inizio partita'); save(); render();
}
function toCSV(g) {
  const hdr = ['Squadra','Num','Giocatore','Min','Punti','TC_seg','TC_tent','3P_seg','3P_tent','TL_seg','TL_tent','Rimb_off','Rimb_dif','Rimb_tot','Assist','Recuperi','Stoppate','Perse','Falli','PlusMinus'];
  const rows = [hdr];
  g.teams.forEach(T => T.players.forEach(p => {
    const s = g.stats[p.id];
    rows.push([T.name, p.num, p.name, fmtMin(s.sec), s.pts, s.fgm, s.fga, s.tpm, s.tpa, s.ftm, s.fta, s.oreb, s.dreb, s.oreb + s.dreb, s.ast, s.stl, s.blk, s.to, s.pf, s.pm]);
  }));
  g.teams.forEach((T, t) => {
    if (!T.isOpp) return;
    const o = g.oppStats || {m1:0,m2:0,m3:0,pf:0};
    rows.push([T.name, '', 'Totale squadra', '', g.score[t], o.m2 + o.m3, '', o.m3, '', o.m1, '', '', '', '', '', '', '', '', o.pf, '']);
  });
  return '\ufeff' + rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(';')).join('\r\n');
}
function download(name, text, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const gname = g => ((g.name ? g.name + '_' : '') + g.teams[0].name + '_' + g.teams[1].name + '_' + g.date.slice(0, 10)).replace(/[^\w\-]+/g, '_');

/* ---------- eventi ---------- */
const H = {
  view: b => { view = b.dataset.v; if (view !== 'box') endBanner = null; if (view === 'subs' && S) initSubs(); render(); },
  sel: b => { const pid = b.dataset.pid; sel = (sel && sel.pid === pid) ? null : {t: +b.dataset.t, pid}; render(); },
  s: b => stat(b.dataset.k),
  goper: b => goPeriod(+b.dataset.q),
  endper: endPeriod,
  backgame: () => { endBanner = null; view = 'game'; render(); },
  lpick: b => lineupPick(b.dataset.id),
  lgo: lineupGo,
  subq: b => { subQ = +b.dataset.q; resetSubForm(); render(); },
  subout: b => { subForm.out = subForm.out === b.dataset.id ? null : b.dataset.id; render(); },
  subin: b => { subForm.inn = subForm.inn === b.dataset.id ? null : b.dataset.id; render(); },
  subnow: () => { const c = Math.ceil(clockOf(subQ)); subForm.m = Math.floor(c / 60); subForm.s = c % 60; render(); },
  subadd: addSub,
  subdel: b => delSub(+b.dataset.seq),
  editstart: editStart,
  undo,
  toggle: toggleClock,
  nextper: startNextPeriod,
  editclock: editClock,
  closemodal: closeModal,
  shotnoloc: () => { const pd = pending; closeModal(); if (pd) apply(pd.k, pd.t, pd.pid, null); },
  newgame: startNewGame,
  stpick: b => pickStarter(b.dataset.id),
  stgo: launchGame,
  sd: b => statDec(b.dataset.k),
  endgame: endGame,
  hres: b => resumeGame(b.dataset.id),
  expteam: exportTeam,
  accin: () => accAuth('in'),
  accnew: () => accAuth('new'),
  accreset: accReset,
  accout: accOut,
  syncnow: () => syncNow(true),
  to: b => doTimeout(+b.dataset.t),
  cb: b => benchFoul(+b.dataset.t, b.dataset.k),
  foul: b => doFoul(b.dataset.ft),
  color: b => { const c = getConv(); c.color = b.dataset.v; saveJSON(CKEY, c); render(); },
  rename: () => { const v = prompt('Nome della partita', S.name || ''); if (v === null) return; S.name = v.trim(); save(); render(); },
  oa: b => oppAction(+b.dataset.t, b.dataset.k),
  addmy: addMyPlayer,
  editmy: b => editMyPlayer(b.dataset.id),
  delmy: b => delMyPlayer(b.dataset.id),
  csv: () => download(gname(S) + '.csv', toCSV(S), 'text/csv;charset=utf-8'),
  json: () => download(gname(S) + '.json', JSON.stringify(S), 'application/json'),
  addplayer: () => openModal('<h3>Aggiungi giocatore</h3><label>Squadra</label><select id="ap-t">' + S.teams.map((T, i) => T.isOpp ? '' : '<option value="' + i + '">' + esc(T.name) + '</option>').join('') + '</select><label>Numero</label><input id="ap-n"><label>Cognome</label><input id="ap-m"><div class="row"><button class="go" data-a="addplayer-ok">Aggiungi</button><button data-a="closemodal">Annulla</button></div>'),
  'addplayer-ok': () => {
    const t = +$('#ap-t').value, num = $('#ap-n').value.trim(), name = $('#ap-m').value.trim();
    if (!num && !name) { toast('Inserisci numero o nome'); return; }
    const id = t + '-' + Date.now();
    S.teams[t].players.push({id, num, name: name || 'Giocatore ' + num}); S.stats[id] = STAT0();
    undoStack = []; closeModal(); save(); render(); toast('Giocatore aggiunto');
  },
  hview: b => { const g = (loadJSON(HKEY) || []).find(x => String(x.id) === b.dataset.id); if (g) openModal('<h3>' + esc(g.teams[0].name) + ' ' + g.score[0] + ' – ' + g.score[1] + ' ' + esc(g.teams[1].name) + '</h3>' + boxHTML(g) + '<button data-a="closemodal">Chiudi</button>'); },
  hcsv: b => { const g = (loadJSON(HKEY) || []).find(x => String(x.id) === b.dataset.id); if (g) download(gname(g) + '.csv', toCSV(g), 'text/csv;charset=utf-8'); },
  hdel: b => { if (!confirm('Eliminare questa partita archiviata?')) return; const tomb = loadJSON(DKEY) || {}; tomb[b.dataset.id] = Date.now(); saveJSON(DKEY, tomb); scheduleSync(); saveJSON(HKEY, (loadJSON(HKEY) || []).filter(x => String(x.id) !== b.dataset.id)); render(); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (b && H[b.dataset.a]) H[b.dataset.a](b, e);
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (e.target.dataset && e.target.dataset.cv) { convChange(e.target); return; }
  if (id === 'sub-m' || id === 'sub-s') {
    subForm.m = +$('#sub-m').value; subForm.s = +$('#sub-s').value || 0;
    const c = subTime(); subForm.m = Math.floor(c / 60); subForm.s = c % 60; render(); return;
  }
  if (id === 'cside') { const c = getConv(); c.side = +e.target.value; saveJSON(CKEY, c); return; }
  if (id === 'impteam') { if (e.target.files[0]) importTeam(e.target.files[0]); return; }
  if (id === 'rname') { const r = getRoster(); r.name = e.target.value.trim(); saveRoster(r); return; }
  if (id === 'sf-t') { shotFilter = {t: e.target.value, pid: 'all'}; render(); }
  else if (id === 'sf-p') { shotFilter.pid = e.target.value; render(); }
  else if (id === 'askloc') { askLoc = e.target.checked; localStorage.setItem(LKEY, askLoc ? '1' : '0'); }
  else if (id === 'imp' && e.target.files[0]) {
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const g = JSON.parse(rd.result);
        if (!g.teams || !g.stats || !g.score) throw 0;
        if (S && !confirm('Importare la partita? Quella corrente verrà archiviata.')) return;
        archiveCurrent(); g.running = false; migrate(g); S = g; sel = null; undoStack = []; view = 'game'; save(); render(); toast('Partita importata');
      } catch (err) { toast('File non valido'); }
    };
    rd.readAsText(e.target.files[0]);
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'gname') gdraft = e.target.value;
  if (e.target.id === 'acc-email') accDraft = e.target.value;
  if (e.target.id === 'tn-opp') {
    const s = loadJSON(TKEY) || {};
    s.opp = {name: $('#tn-opp').value}; saveJSON(TKEY, s);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'acc-pw') { e.preventDefault(); accAuth('in'); return; }
  if (e.key === 'Enter' && (e.target.id === 'rp-n' || e.target.id === 'rp-m')) { e.preventDefault(); addMyPlayer(); return; }
  if (e.code === 'Space' && S && view === 'game' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); toggleClock(); }
});
window.addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else { if (S && S.running) wake(true); scheduleSync(); } });
window.addEventListener('online', () => scheduleSync());

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
if (S) { migrate(S); recompute(S); }
cloudInit();
render();
</script>
