<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a101d">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Basket Stats</title>
<style>
:root{--bg:#0b1220;--panel:#111a2e;--panel2:#18243f;--line:#27365a;--tx:#e8eefc;--mut:#8ea0c4;--acc:#f59e0b;--ok:#16a34a;--ko:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;user-select:none;-webkit-user-select:none}
button:active{filter:brightness(1.35)}
button:disabled{opacity:.35}
input,select,textarea{font:inherit;color:var(--tx);background:#0b1426;border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
textarea{min-height:230px;font-family:ui-monospace,Consolas,monospace}
label{display:block;color:var(--mut);font-size:14px;margin:8px 0 4px}
[hidden]{display:none!important}
nav{display:flex;position:sticky;top:0;z-index:5;background:#0a101d;border-bottom:1px solid var(--line)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:14px 4px;font-weight:600;color:var(--mut)}
nav button.on{color:var(--acc);box-shadow:inset 0 -3px var(--acc)}
main{padding:10px;max-width:1300px;margin:0 auto}
h3{margin:4px 0 8px}
.mut{color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.row>*{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
/* scoreboard */
.sb{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:10px}
.sbt{text-align:center;min-width:0}
.tn{font-weight:700;color:var(--mut);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc{font-size:clamp(44px,9vw,84px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.sbm{text-align:center}
.per{color:var(--acc);font-weight:700}
.clk{font-size:clamp(34px,6vw,56px);font-weight:800;font-variant-numeric:tabular-nums;cursor:pointer;padding:0 8px;line-height:1.1}
.sbb{display:flex;gap:8px;justify-content:center;margin-top:4px}
button.go{background:var(--ok);border-color:var(--ok);font-weight:700}
button.stop{background:var(--ko);border-color:var(--ko);font-weight:700}
/* board */
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pad{grid-column:1/-1;order:3;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px}
@media(min-width:900px){.board{grid-template-columns:1fr 340px 1fr}.pad{grid-column:auto;order:0}}
.col{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:8px}
.ch{display:flex;justify-content:space-between;align-items:center;font-weight:700;padding:2px 4px;gap:6px}
.ch span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tf{font-size:13px;color:var(--mut);white-space:nowrap}
.tf.bonus{color:#ff6b6b;font-weight:700}
.pc{display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;text-align:left;gap:0 8px;min-height:64px;align-items:center}
.pc .n{grid-row:1/3;font-size:26px;font-weight:800;text-align:center;color:var(--acc)}
.pc .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .ps{font-size:12px;color:var(--mut)}
.pc.sel{outline:3px solid var(--acc);background:#2a2f45}
.pc.warn{border-color:#f59e0b}
.pc.out{border-color:var(--ko);background:#3a1620}
.who{text-align:center;font-weight:700;padding:6px 4px 10px;min-height:36px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 button{min-height:58px;font-weight:700;padding:6px}
.grid3 .ok{background:#12391f;border-color:var(--ok)}
.grid3 .ko{background:#431616;border-color:#7f1d1d}
.grid3 .ut{background:#16253f}
/* tables */
.tw{overflow-x:auto;margin-bottom:6px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15px}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:13px}
th:nth-child(2),td:nth-child(2){text-align:left}
tr.tot td{font-weight:800;border-top:2px solid var(--line)}
.pct{color:var(--mut);margin:4px 2px 14px;font-size:14px}
.h2{display:flex;justify-content:space-between;align-items:baseline;margin:14px 2px 6px;font-weight:800;font-size:18px}
/* court */
.court{width:100%;max-width:560px;display:block;margin:8px auto;border-radius:8px;touch-action:manipulation}
/* log */
.lg{padding:8px 4px;border-bottom:1px solid var(--line)}
.lg b{color:var(--acc);font-variant-numeric:tabular-nums;margin-right:6px}
/* modal / toast */
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
#modal.on{display:flex}
#modal .m{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;max-width:780px;width:100%;max-height:92vh;overflow:auto}
.bench{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.bench button{min-height:56px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#000d;border:1px solid var(--line);padding:10px 16px;border-radius:999px;z-index:30;display:none}
.chk{display:flex;align-items:center;gap:8px;color:var(--tx);margin:0}
.chk input{width:auto}
.hi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.hi .b{display:flex;gap:6px}
summary{cursor:pointer;padding:4px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1}
.grid2 button{min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px}
.grid2 .ok{background:#12391f;border-color:var(--ok)}
.grid2 .ko{background:#431616;border-color:#7f1d1d}
.ob{font-size:34px;font-weight:800;line-height:1}
.os{font-size:12px;color:var(--mut)}
table.o th:nth-child(2),table.o td:nth-child(2){text-align:right}
.chip{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:-2px;border:2px solid #94a3b8}
.chip.jw{background:#f8fafc}
.chip.jb{background:#2563eb;border-color:#60a5fa}
.col.jw{border-top:4px solid #f8fafc}
.col.jb{border-top:4px solid #3b82f6}
.gname{text-align:center;color:var(--acc);font-weight:700;margin:0 0 6px}
.cbtn{min-height:52px;font-weight:700}
.cbtn.on{outline:3px solid var(--acc);background:#2a2f45}
.cv{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.cv .chk{gap:10px}
.cv .chk input{width:24px;height:24px}
</style>
</head>
<body>
<nav>
  <button data-a="view" data-v="game">Partita</button>
  <button data-a="view" data-v="box">Box score</button>
  <button data-a="view" data-v="shots">Tiri</button>
  <button data-a="view" data-v="log">Cronaca</button>
  <button data-a="view" data-v="menu">Menu</button>
</nav>
<main>
  <section id="v-game"></section>
  <section id="v-box" hidden></section>
  <section id="v-shots" hidden></section>
  <section id="v-log" hidden></section>
  <section id="v-menu" hidden></section>
</main>
<div id="modal"><div class="m" id="modal-c"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* ---------- utilità ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => { s = Math.max(0, Math.ceil(s)); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); };
const fmtMin = s => { s = Math.round(s); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
const pct = (m,a) => a ? Math.round(m/a*100) + '%' : '–';
const periodName = (q,nq) => q <= nq ? 'Q' + q : 'OT' + (q - nq);
const loadJSON = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } };
const saveJSON = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };

const KEY = 'bbstats_current', HKEY = 'bbstats_history', TKEY = 'bbstats_teams', LKEY = 'bbstats_askloc';
const RKEY = 'bbstats_roster', CKEY = 'bbstats_conv';

/* ---------- la mia squadra (anagrafica) e convocati ---------- */
const getRoster = () => loadJSON(RKEY) || {name: 'La mia squadra', players: []};
const getConv = () => { const c = loadJSON(CKEY) || {}; return {sel: c.sel || [], starters: c.starters || [], side: c.side || 0, color: c.color === 'blue' ? 'blue' : 'white'}; };
const byNum = (a, b) => {
  const x = a.num === '' ? 1e9 : +a.num, y = b.num === '' ? 1e9 : +b.num;
  return x - y || a.name.localeCompare(b.name);
};
function addMyPlayer() {
  const n = $('#rp-n').value.trim(), m = $('#rp-m').value.trim();
  if (!n && !m) { toast('Inserisci numero e cognome'); return; }
  const r = getRoster();
  r.players.push({id: 'p' + Date.now(), num: n, name: m || 'Giocatore ' + n});
  r.players.sort(byNum); saveJSON(RKEY, r); menuOpen.roster = true; render();
  setTimeout(() => { const f = $('#rp-n'); if (f) f.focus(); }, 0);
}
function editMyPlayer(id) {
  const r = getRoster(), p = r.players.find(x => x.id === id); if (!p) return;
  const v = prompt('Numero e cognome (es. 7 Rossi)', (p.num !== '' ? p.num + ' ' : '') + p.name); if (v === null) return;
  const m = v.trim().match(/^(\d{1,3})\s*[-.:)]?\s*(.*)$/);
  if (m) { p.num = m[1]; p.name = m[2] || 'Giocatore ' + m[1]; } else if (v.trim()) { p.num = ''; p.name = v.trim(); } else return;
  r.players.sort(byNum); saveJSON(RKEY, r); menuOpen.roster = true; render();
}
function delMyPlayer(id) {
  const r = getRoster(), p = r.players.find(x => x.id === id); if (!p) return;
  if (!confirm('Eliminare ' + label(p) + ' dalla squadra?')) return;
  r.players = r.players.filter(x => x.id !== id); saveJSON(RKEY, r);
  const c = getConv(); c.sel = c.sel.filter(x => x !== id); c.starters = c.starters.filter(x => x !== id); saveJSON(CKEY, c);
  menuOpen.roster = true; render();
}
function updateConvUI(c) {
  const el = $('#cvcount'); if (el) el.textContent = c.sel.length + '/12';
}
function convChange(inp) {
  const c = getConv(), id = inp.dataset.id;
  if (inp.checked) {
    if (c.sel.length >= 12) { inp.checked = false; toast('Massimo 12 convocati'); return; }
    c.sel.push(id);
  } else { c.sel = c.sel.filter(x => x !== id); c.starters = c.starters.filter(x => x !== id); }
  saveJSON(CKEY, c); updateConvUI(c);
}

const STAT0 = () => ({sec:0,pts:0,fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0,oreb:0,dreb:0,ast:0,stl:0,blk:0,to:0,pf:0,pm:0});

/* ---------- stato dell'applicazione ---------- */
let S = loadJSON(KEY);          // partita corrente
if (S) S.running = false;
let sel = null;                  // {t,pid}
let view = 'game';
let undoStack = [];
let pending = null;
let askLoc = localStorage.getItem(LKEY) !== '0';
let shotFilter = {t:'all', pid:'all'};
let menuOpen = {};
let gdraft = '';                 // nome partita digitato nel form (non perso se il Menu si ridisegna)               // riquadri del Menu aperti/chiusi dall'utente
document.addEventListener('toggle', e => {
  const k = e.target && e.target.dataset && e.target.dataset.k;
  if (k) menuOpen[k] = e.target.open;
}, true);
let lastTs = null, lastSave = 0, lastBoxRender = 0;

function save() { if (S) saveJSON(KEY, S); lastSave = performance.now(); }

/* ---------- creazione partita ---------- */
function parseRoster(text, ti) {
  const out = [];
  String(text).split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach((line, i) => {
    const m = line.match(/^(\d{1,3})\s*[-.:)]?\s*(.*)$/);
    out.push({id: ti + '-' + i, num: m ? m[1] : '', name: m ? (m[2] || 'Giocatore ' + m[1]) : line});
  });
  return out;
}
function newGame(cfg) {
  const teams = cfg.teams.map((t, ti) => {
    const players = t.players ? t.players.map((p, i) => ({id: ti + '-' + i, num: p.num, name: p.name})) : parseRoster(t.roster, ti);
    return {name: t.name || (ti ? 'Ospiti' : 'Casa'), players, isOpp: !!t.isOpp, onCourt: players.slice(0,5).map(p => p.id)};
  });
  const stats = {};
  teams.forEach(t => t.players.forEach(p => stats[p.id] = STAT0()));
  return {id: Date.now(), date: new Date().toISOString(), name: cfg.name || '', colors: cfg.colors || null, teams, stats, shots: [], oppStats: {m1:0,m2:0,m3:0,pf:0}, score: [0,0],
          quarter: 1, qlen: cfg.qlen * 60, nq: cfg.nq, clock: cfg.qlen * 60, running: false, tf: [0,0], log: []};
}
function defaultRoster() { let r = []; for (let n = 4; n <= 15; n++) r.push(n + ' Giocatore ' + n); return r.join('\n'); }
function defaultTeams() { return {opp: {name: 'Avversari', roster: defaultRoster()}, qlen: 10, nq: 4}; }

/* ---------- helpers di stato ---------- */
function findPlayer(g, pid) { for (const t of g.teams) { const p = t.players.find(x => x.id === pid); if (p) return p; } return null; }
const label = p => (p.num !== '' ? '#' + p.num + ' ' : '') + p.name;
const jc = t => !S || !S.colors ? '' : (S.colors[t] === 'blue' ? 'jb' : (S.colors[t] === 'white' ? 'jw' : ''));
const chip = t => jc(t) ? '<i class="chip ' + jc(t) + '"></i>' : '';
function snap() { undoStack.push(JSON.stringify(S)); if (undoStack.length > 200) undoStack.shift(); }
function addLog(msg) { S.log.push({q: S.quarter, c: S.clock, msg}); }
function addPoints(t, pid, n) {
  S.stats[pid].pts += n; S.score[t] += n;
  S.teams[t].onCourt.forEach(id => S.stats[id].pm += n);
  S.teams[1-t].onCourt.forEach(id => S.stats[id].pm -= n);
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 1800);
}
function openModal(html) { $('#modal-c').innerHTML = html; $('#modal').classList.add('on'); }
function closeModal() { $('#modal').classList.remove('on'); pending = null; }

/* ---------- azioni ---------- */
const NAMES = {m1:'Tiro libero a segno',x1:'Tiro libero sbagliato',m2:'Canestro da 2',x2:'Tiro da 2 sbagliato',
  m3:'Canestro da 3',x3:'Tiro da 3 sbagliato',oreb:'Rimbalzo offensivo',dreb:'Rimbalzo difensivo',ast:'Assist',
  stl:'Recupero',blk:'Stoppata',to:'Palla persa',pf:'Fallo'};

function stat(k) {
  if (!sel) { toast('Tocca prima un giocatore'); return; }
  if (/^[mx][23]$/.test(k) && askLoc) { openShot(k); return; }
  apply(k, sel.t, sel.pid, null);
}
function apply(k, t, pid, loc) {
  snap();
  const st = S.stats[pid], p = findPlayer(S, pid);
  if (k === 'm1' || k === 'x1') {
    st.fta++; if (k === 'm1') { st.ftm++; addPoints(t, pid, 1); }
  } else if (/^[mx][23]$/.test(k)) {
    const three = k[1] === '3', made = k[0] === 'm';
    st.fga++; if (three) st.tpa++;
    if (made) { st.fgm++; if (three) st.tpm++; addPoints(t, pid, three ? 3 : 2); }
    if (loc) S.shots.push({pid, t, x: Math.round(loc.x), y: Math.round(loc.y), made, three});
  } else {
    st[k]++; if (k === 'pf') S.tf[t]++;
  }
  const made = /^m/.test(k);
  addLog(label(p) + ' (' + S.teams[t].name + '): ' + NAMES[k] + (made ? '  [' + S.score[0] + '-' + S.score[1] + ']' : ''));
  save(); render();
}
function oppAction(t, k) {
  snap();
  const T = S.teams[t], o = S.oppStats;
  if (k === 'pf') { o.pf++; S.tf[t]++; addLog(T.name + ': Fallo'); }
  else {
    const n = +k[1]; o[k]++; S.score[t] += n;
    S.teams[1 - t].onCourt.forEach(id => S.stats[id].pm -= n);
    addLog(T.name + ': ' + (n === 1 ? 'Tiro libero a segno' : 'Canestro da ' + n) + '  [' + S.score[0] + '-' + S.score[1] + ']');
  }
  save(); render();
}
function openShot(k) {
  const p = findPlayer(S, sel.pid);
  pending = {k, t: sel.t, pid: sel.pid};
  openModal('<h3>' + esc(label(p)) + ' — ' + (k[0] === 'm' ? 'a segno' : 'sbagliato') + ' da ' + k[1] + '</h3>' +
    '<div class="mut">Tocca il campo nel punto da cui ha tirato</div>' + courtSVG('', 'pick') +
    '<div class="row"><button data-a="shotnoloc">Senza posizione</button><button data-a="closemodal">Annulla</button></div>');
  $('#pick').addEventListener('click', ev => {
    const r = ev.currentTarget.getBoundingClientRect();
    const loc = {x: (ev.clientX - r.left) / r.width * 500, y: (ev.clientY - r.top) / r.height * 470};
    const pd = pending; closeModal(); apply(pd.k, pd.t, pd.pid, loc);
  });
}
function openSub() {
  if (!sel) { toast('Tocca prima il giocatore che esce'); return; }
  const T = S.teams[sel.t], out = findPlayer(S, sel.pid);
  const bench = T.players.filter(p => !T.onCourt.includes(p.id));
  if (!bench.length) { toast('Nessuno in panchina'); return; }
  openModal('<h3>Esce ' + esc(label(out)) + '</h3><div class="mut">Chi entra?</div><div class="bench">' +
    bench.map(p => '<button data-a="subpick" data-pid="' + p.id + '">' + esc(label(p)) + ' <small class="mut">' + S.stats[p.id].pf + ' f</small></button>').join('') +
    '</div><button data-a="closemodal">Annulla</button>');
}
function doSub(pid) {
  snap();
  const T = S.teams[sel.t], idx = T.onCourt.indexOf(sel.pid);
  const out = findPlayer(S, sel.pid), inn = findPlayer(S, pid);
  T.onCourt[idx] = pid;
  addLog('Cambio ' + T.name + ': esce ' + label(out) + ', entra ' + label(inn));
  sel = {t: sel.t, pid}; closeModal(); save(); render();
}
function undo() {
  if (!undoStack.length) { toast('Niente da annullare'); return; }
  const cur = S;
  S = JSON.parse(undoStack.pop());
  S.clock = cur.clock; S.quarter = cur.quarter; S.running = cur.running;
  Object.keys(S.stats).forEach(id => { if (cur.stats[id]) S.stats[id].sec = cur.stats[id].sec; });
  save(); render(); toast('Annullato');
}
function toggleClock() {
  if (S.clock <= 0) { toast('Tempo finito: usa "Periodo ▸" o modifica il tempo'); return; }
  S.running = !S.running; lastTs = null; wake(S.running); save(); render();
}
function nextPeriod() {
  if (S.running) { S.running = false; wake(false); }
  if (S.clock > 0 && !confirm('Il tempo non è finito. Passare al periodo successivo?')) { render(); return; }
  if (S.quarter >= S.nq) {
    if (S.score[0] !== S.score[1]) { toast('Partita finita: archiviala dal Menu'); return; }
    if (!confirm('Pareggio. Iniziare un supplementare da 5 minuti?')) return;
  }
  S.quarter++; S.clock = S.quarter <= S.nq ? S.qlen : 300; S.tf = [0,0]; undoStack = [];
  addLog('Inizio ' + periodName(S.quarter, S.nq)); save(); render();
}
function editClock() {
  const v = prompt('Imposta il tempo (mm:ss)', fmt(S.clock)); if (v === null) return;
  const m = v.trim().match(/^(\d{1,2})(?::(\d{1,2}))?$/); if (!m) { toast('Formato non valido'); return; }
  S.clock = (+m[1]) * 60 + (+(m[2] || 0)); save(); render();
}
let wl = null;
async function wake(on) {
  try {
    if (on && 'wakeLock' in navigator) wl = await navigator.wakeLock.request('screen');
    else if (wl) { await wl.release(); wl = null; }
  } catch(e) {}
}
function beep() {
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = .2; o.start(); o.stop(c.currentTime + .8);
  } catch(e) {}
}

/* ---------- cronometro ---------- */
setInterval(() => {
  if (!S || !S.running) { lastTs = null; return; }
  const now = performance.now();
  if (lastTs == null) { lastTs = now; return; }
  const d = Math.min((now - lastTs) / 1000, S.clock); lastTs = now;
  S.clock -= d;
  S.teams.forEach(t => t.onCourt.forEach(id => S.stats[id].sec += d));
  if (S.clock <= 0.001) {
    S.clock = 0; S.running = false; wake(false); addLog('Fine ' + periodName(S.quarter, S.nq));
    save(); beep(); render(); return;
  }
  const c = $('#clock'); if (c) c.textContent = fmt(S.clock);
  if (view === 'box' && now - lastBoxRender > 1000) { lastBoxRender = now; renderBox(); }
  if (now - lastSave > 5000) save();
}, 200);

/* ---------- archivio, export, import ---------- */
function archiveCurrent() {
  if (!S) return;
  const hist = loadJSON(HKEY) || [];
  S.running = false; hist.unshift(S); saveJSON(HKEY, hist.slice(0, 40));
}
let startCtx = null;
function startNewGame() {
  const r = getRoster(), c = getConv();
  if (!r.players.length) { toast('Aggiungi prima i giocatori alla tua squadra'); return; }
  const mine = r.players.filter(p => c.sel.includes(p.id));
  if (!mine.length) { toast('Seleziona i convocati'); return; }
  const qlen = Math.max(1, +$('#qlen').value || 10), nq = Math.min(4, Math.max(1, +$('#nq').value || 4));
  const oppName = $('#tn-opp').value.trim() || 'Avversari';
  saveJSON(TKEY, {opp: {name: oppName}, qlen, nq});
  startCtx = {
    mine, side: c.side, qlen, nq, color: c.color, gameName: $('#gname').value.trim(),
    myName: (r.name || '').trim() || 'La mia squadra',
    oppT: {name: oppName, players: [], isOpp: true},
    starters: c.starters.filter(id => mine.some(p => p.id === id)).slice(0, 5)
  };
  if (mine.length <= 5) { startCtx.starters = mine.map(p => p.id); launchGame(); return; }
  openStarters();
}
function openStarters() {
  const x = startCtx, n = x.starters.length;
  openModal('<h3>Quintetto iniziale</h3><div class="mut">Tocca i 5 giocatori che iniziano · <b>' + n + '/5</b></div><div class="bench">' +
    x.mine.map(p => '<button class="' + (x.starters.includes(p.id) ? 'go' : '') + '" data-a="stpick" data-id="' + p.id + '">' + esc(label(p)) + '</button>').join('') +
    '</div><div class="row"><button class="go" data-a="stgo"' + (n === 5 ? '' : ' disabled') + '>Avvia partita</button><button data-a="closemodal">Annulla</button></div>');
}
function pickStarter(id) {
  const x = startCtx; if (!x) return;
  if (x.starters.includes(id)) x.starters = x.starters.filter(i => i !== id);
  else if (x.starters.length >= 5) { toast('Hai già scelto 5 giocatori: togline uno'); return; }
  else x.starters.push(id);
  openStarters();
}
function launchGame() {
  const x = startCtx; if (!x) return;
  if (S && !confirm('La partita corrente verrà archiviata. Continuare?')) return;
  const c = getConv(); c.starters = x.starters.slice(); saveJSON(CKEY, c);   // ricordo il quintetto per la prossima volta
  const first = x.mine.filter(p => x.starters.includes(p.id)), rest = x.mine.filter(p => !x.starters.includes(p.id));
  const myT = {name: x.myName, players: [...first, ...rest]};
  const cfg = {teams: x.side === 0 ? [myT, x.oppT] : [x.oppT, myT], qlen: x.qlen, nq: x.nq, name: x.gameName,
    colors: x.side === 0 ? [x.color, x.color === 'white' ? 'blue' : 'white'] : [x.color === 'white' ? 'blue' : 'white', x.color]};
  closeModal(); startCtx = null; gdraft = ''; archiveCurrent();
  S = newGame(cfg); sel = null; undoStack = []; shotFilter = {t:'all', pid:'all'}; view = 'game';
  addLog('Inizio partita'); save(); render();
}
function toCSV(g) {
  const hdr = ['Squadra','Num','Giocatore','Min','Punti','TC_seg','TC_tent','3P_seg','3P_tent','TL_seg','TL_tent','Rimb_off','Rimb_dif','Rimb_tot','Assist','Recuperi','Stoppate','Perse','Falli','PlusMinus'];
  const rows = [hdr];
  g.teams.forEach(T => T.players.forEach(p => {
    const s = g.stats[p.id];
    rows.push([T.name, p.num, p.name, fmtMin(s.sec), s.pts, s.fgm, s.fga, s.tpm, s.tpa, s.ftm, s.fta, s.oreb, s.dreb, s.oreb + s.dreb, s.ast, s.stl, s.blk, s.to, s.pf, s.pm]);
  }));
  g.teams.forEach((T, t) => {
    if (!T.isOpp) return;
    const o = g.oppStats || {m1:0,m2:0,m3:0,pf:0};
    rows.push([T.name, '', 'Totale squadra', '', g.score[t], o.m2 + o.m3, '', o.m3, '', o.m1, '', '', '', '', '', '', '', '', o.pf, '']);
  });
  return '\ufeff' + rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(';')).join('\r\n');
}
function download(name, text, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

  csv: () => download(gname(S) + '.csv', toCSV(S), 'text/csv;charset=utf-8'),
  json: () => download(gname(S) + '.json', JSON.stringify(S), 'application/json'),
  addplayer: () => openModal('<h3>Aggiungi giocatore</h3><label>Squadra</label><select id="ap-t">' + S.teams.map((T, i) => T.isOpp ? '' : '<option value="' + i + '">' + esc(T.name) + '</option>').join('') + '</select><label>Numero</label><input id="ap-n"><label>Cognome</label><input id="ap-m"><div class="row"><button class="go" data-a="addplayer-ok">Aggiungi</button><button data-a="closemodal">Annulla</button></div>'),
  'addplayer-ok': () => {
    const t = +$('#ap-t').value, num = $('#ap-n').value.trim(), name = $('#ap-m').value.trim();
    if (!num && !name) { toast('Inserisci numero o nome'); return; }
    const id = t + '-' + Date.now();
    S.teams[t].players.push({id, num, name: name || 'Giocatore ' + num}); S.stats[id] = STAT0();
    undoStack = []; closeModal(); save(); render(); toast('Giocatore aggiunto');
  },
  hview: b => { const g = (loadJSON(HKEY) || []).find(x => String(x.id) === b.dataset.id); if (g) openModal('<h3>' + esc(g.teams[0].name) + ' ' + g.score[0] + ' – ' + g.score[1] + ' ' + esc(g.teams[1].name) + '</h3>' + boxHTML(g) + '<button data-a="closemodal">Chiudi</button>'); },
  hcsv: b => { const g = (loadJSON(HKEY) || []).find(x => String(x.id) === b.dataset.id); if (g) download(gname(g) + '.csv', toCSV(g), 'text/csv;charset=utf-8'); },
  hdel: b => { if (!confirm('Eliminare questa partita archiviata?')) return; saveJSON(HKEY, (loadJSON(HKEY) || []).filter(x => String(x.id) !== b.dataset.id)); render(); }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (b && H[b.dataset.a]) H[b.dataset.a](b, e);
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (e.target.dataset && e.target.dataset.cv) { convChange(e.target); return; }
  if (id === 'cside') { const c = getConv(); c.side = +e.target.value; saveJSON(CKEY, c); return; }
  if (id === 'rname') { const r = getRoster(); r.name = e.target.value.trim(); saveJSON(RKEY, r); return; }
  if (id === 'sf-t') { shotFilter = {t: e.target.value, pid: 'all'}; render(); }
  else if (id === 'sf-p') { shotFilter.pid = e.target.value; render(); }
  else if (id === 'askloc') { askLoc = e.target.checked; localStorage.setItem(LKEY, askLoc ? '1' : '0'); }
  else if (id === 'imp' && e.target.files[0]) {
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const g = JSON.parse(rd.result);
        if (!g.teams || !g.stats || !g.score) throw 0;
        if (S && !confirm('Importare la partita? Quella corrente verrà archiviata.')) return;
        archiveCurrent(); g.running = false; S = g; sel = null; undoStack = []; view = 'game'; save(); render(); toast('Partita importata');
      } catch (err) { toast('File non valido'); }
    };
    rd.readAsText(e.target.files[0]);
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'gname') gdraft = e.target.value;
  if (e.target.id === 'tn-opp') {
    const s = loadJSON(TKEY) || {};
    s.opp = {name: $('#tn-opp').value}; saveJSON(TKEY, s);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.target.id === 'rp-n' || e.target.id === 'rp-m')) { e.preventDefault(); addMyPlayer(); return; }
  if (e.code === 'Space' && S && view === 'game' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); toggleClock(); }
});
window.addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else if (S && S.running) wake(true); });

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
</script>
</body>
</html>
